; アップロードサイズの上限設定
;
; 要望申請フォームは「活動写真 最大3枚×5MB以内」「PDF資料5種×10MB以内」を
; 同時に送信できる仕様のため、最大時はリクエスト全体で約65MBになり得る。
; PHPのデフォルト post_max_size（多くの環境で8M）のままだと、写真が数枚
; 大きいだけで上限を超えてしまい、その場合PHPは $_POST / $_FILES を
; 丸ごと空にしてしまう（＝送信したはずの全項目が「必須です」エラーになる）。
;
; post_max_size は upload_max_filesize 以上の値にする必要がある
; （複数ファイル・他のフォーム項目も同じリクエストに含まれるため、
; 単一ファイルの上限より十分大きく設定する）。
;
; 注意：post_max_size・upload_max_filesize は PHP起動時に確定する設定のため、
; PHPコード側（ini_set）からは変更できない。.user.ini はPHP-FPM/CGI・mod_php
; いずれの構成でも読み込まれるため、サーバー本体のphp.iniを直接編集できない
; 環境でも有効。.user.ini の反映には少し時間がかかる場合がある
; （PHP-FPMのuser_ini.cache_ttl既定値: 300秒）。

upload_max_filesize = 12M
post_max_size = 80M
